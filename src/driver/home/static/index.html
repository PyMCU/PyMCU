<title>PyMCU Libraries</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#030620">
<!--
  The palette and type are the project's, not this page's: the tokens below are
  the ones docs.pymcu.org and the playground ship, so moving between them is a
  continuation rather than a jump. The playground's own rule is kept too --
  blue is the interaction accent, copper is reserved for what is really
  hardware, which here is the flash bar.

  Inter and IBM Plex Mono are requested the way the docs request them, so a
  browser that has been on the site already has them cached. Offline, the
  stacks fall back to the playground's system fonts and nothing else changes.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #030620;
    --panel: #0a0e2e;
    --card: #0c1135;
    --raised: #111640;
    --line: #1c2250;
    --line-hi: #2c3470;
    --text: #e5ecf6;
    --muted: #98a0b8;
    --faint: #6d78a0;
    --accent: #2f7bff;
    --accent-hi: #4f8dff;
    --accent-deep: #0161ef;
    --accent-soft: rgba(47, 123, 255, .14);
    --copper: #d08a54;
    --copper-bright: #efae70;
    --ok: #56d6a0;
    --err: #fb7185;
    --warn: #f0a83a;
    --logo-py: #4a9fd4;

    --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", "Cascadia Code", Menlo, monospace;
    --rail: 216px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff;
      --panel: #f4f7fd;
      --card: #ffffff;
      --raised: #f7faff;
      --line: #e3e9f5;
      --line-hi: #c6d6f0;
      --text: #101010;
      --muted: #5b6270;
      --faint: #8a92a3;
      --accent: #0161ef;
      --accent-hi: #0143a8;
      --accent-deep: #0154cf;
      --accent-soft: rgba(1, 97, 239, .09);
      --copper: #a8602c;
      --copper-bright: #8f4f22;
      --ok: #12855c;
      --err: #c03049;
      --warn: #9a6a10;
      --logo-py: #2b7fb8;
    }
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.55 var(--sans);
    display: grid; grid-template-columns: var(--rail) 1fr;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  /* ── Rail ────────────────────────────────────────────────────────────── */

  .rail {
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 100vh; position: sticky; top: 0;
  }
  .brand { padding: 18px 18px 14px; font: 700 19px/1 var(--sans); letter-spacing: -.02em; }
  .brand .py { color: var(--logo-py); }
  .brand .sub {
    display: block; margin-top: 5px; font: 500 11px/1 var(--mono);
    letter-spacing: .06em; color: var(--faint); text-transform: uppercase;
  }
  .rail nav { padding: 6px 10px; display: flex; flex-direction: column; gap: 2px; }
  .rail nav a {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 6px; color: var(--muted);
    font-weight: 500; font-size: 14px;
  }
  .rail nav a:hover { background: var(--raised); color: var(--text); text-decoration: none; }
  .rail nav a[aria-current="page"] {
    background: var(--accent-soft); color: var(--accent-hi);
    box-shadow: inset 2px 0 0 var(--accent);
  }
  .rail nav .count { font: 500 11.5px/1 var(--mono); color: var(--faint); }
  .rail .foot {
    margin-top: auto; padding: 14px 18px; border-top: 1px solid var(--line);
    font: 12px/1.5 var(--mono); color: var(--faint);
  }
  .rail .foot b { display: block; color: var(--muted); font-weight: 500; }

  /* ── View chrome ─────────────────────────────────────────────────────── */

  main { min-width: 0; padding: 26px 30px 60px; max-width: 1080px; }
  .head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font: 600 24px/1.2 var(--sans); letter-spacing: -.02em; }
  .lede { color: var(--muted); margin-bottom: 22px; max-width: 68ch; }
  h2 { font: 600 13px/1 var(--sans); letter-spacing: .04em; text-transform: uppercase;
       color: var(--faint); margin: 26px 0 10px; }
  .back { font: 500 13px/1 var(--sans); color: var(--muted); margin-bottom: 10px; display: inline-block; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card .k { font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
  .card .v { margin-top: 8px; font: 600 19px/1.2 var(--sans); letter-spacing: -.01em; }
  .card .v.mono { font-family: var(--mono); font-size: 16px; font-weight: 500; }
  .card .n { margin-top: 5px; font-size: 12.5px; color: var(--muted); }

  /* Flash: copper, because it is the only thing here that is hardware. */
  .flash { margin-top: 12px; }
  .flash .bar {
    height: 10px; border-radius: 999px; background: var(--raised);
    border: 1px solid var(--line); overflow: hidden; display: flex;
  }
  .flash .bar i { display: block; height: 100%; background: var(--copper); }
  .flash .bar i.ghost {
    background: repeating-linear-gradient(-45deg, var(--copper-bright) 0 2px, transparent 2px 6px);
  }
  .flash .legend {
    display: flex; justify-content: space-between; margin-top: 6px;
    font: 500 11.5px/1 var(--mono); color: var(--faint);
  }
  .flash .legend b { color: var(--copper-bright); font-weight: 600; }

  /* ── Lists ───────────────────────────────────────────────────────────── */

  .list { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
  .item {
    display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center;
    padding: 13px 16px; border-bottom: 1px solid var(--line); width: 100%;
    background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  .item:last-child { border-bottom: 0; }
  .item:hover { background: var(--raised); }
  .item .nm { font-weight: 600; display: block; }
  .item .nm .ver { font: 500 12px/1 var(--mono); color: var(--faint); margin-left: 7px; }
  .item .desc { color: var(--muted); font-size: 13.5px; margin-top: 2px; display: block; }
  .item .tagline { margin-top: 5px; font: 500 11.5px/1 var(--mono); color: var(--faint); display: block; }
  .item .size { font: 600 14px/1 var(--mono); color: var(--copper-bright); white-space: nowrap; }
  .item .size.na { color: var(--faint); font-weight: 500; }
  .item .chev { color: var(--faint); font-size: 15px; }
  .item.off .nm, .item.off .size { opacity: .55; }

  .pill {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font: 500 11px/1.6 var(--mono); border: 1px solid var(--line-hi); color: var(--muted);
  }
  .pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .pill.no { color: var(--err); border-color: color-mix(in srgb, var(--err) 45%, transparent); }

  .empty { padding: 26px 16px; color: var(--muted); text-align: center; }
  .empty p { margin-bottom: 10px; }

  /* ── Tabs (library detail) ───────────────────────────────────────────── */

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 18px 0; }
  .tabs button {
    background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted);
    font: 500 13.5px/1 var(--sans); padding: 10px 12px; cursor: pointer;
  }
  .tabs button:hover { color: var(--text); }
  .tabs button[aria-selected="true"] { color: var(--accent-hi); border-bottom-color: var(--accent); }

  table.matrix { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.matrix th, table.matrix td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  table.matrix th { font: 500 11px/1 var(--mono); letter-spacing: .06em;
                    text-transform: uppercase; color: var(--faint); }
  table.matrix td.n { font-family: var(--mono); }

  pre.cmd {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px; font: 13px/1.7 var(--mono); overflow-x: auto; color: var(--text);
  }
  pre.cmd .p { color: var(--faint); }
  /* Token colours are the playground's, verbatim: the same snippet should not
     change colour depending on which PyMCU surface you are looking at. */
  .tk-kw { color: var(--copper-bright); }
  .tk-str { color: var(--ok); }
  .tk-com { color: var(--muted); font-style: italic; }
  .tk-num { color: #e5c06a; }
  .tk-type { color: #9fc4e8; }
  .tk-dec { color: var(--copper); }


  /* Where a library comes from, as a row of quiet chips rather than a heading
     and a raw URL. The address still lives on the link, which is where a
     browser shows it. */
  .links { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 0; }
  .linkchip {
    display: inline-flex; align-items: baseline; gap: 8px;
    padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--text); font: 500 13px/1.3 var(--mono);
    text-decoration: none;
  }
  a.linkchip:hover { border-color: var(--accent); color: var(--accent-hi); text-decoration: none; }
  .linkchip .what {
    font: 500 10px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase;
    color: var(--faint);
  }
  .linkchip.static { color: var(--muted); }

  .cli { color: var(--faint); font-size: 12.5px; }
  .cli code { font: 12.5px/1.5 var(--mono); color: var(--muted); }

  /* Readme: someone else's prose, so it gets room to breathe and a measure. */
  .readme { max-width: 74ch; }
  .readme p { margin: 10px 0; }
  .readme h2.md, .readme h3.md, .readme h4.md {
    font: 600 15px/1.35 var(--sans); color: var(--text);
    text-transform: none; letter-spacing: 0; margin: 22px 0 8px;
  }
  .readme h2.md { font-size: 17px; }
  .readme ul { margin: 10px 0 10px 20px; }
  .readme li { margin: 4px 0; }
  .readme code {
    font: 12.5px/1.5 var(--mono); background: var(--raised);
    border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px;
  }
  .readme pre.cmd { margin: 12px 0; }
  .readme pre.cmd code { background: none; border: 0; padding: 0; }

  /* ── Controls ────────────────────────────────────────────────────────── */

  .bar-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  input[type=search], input[type=text], input[type=number], select {
    padding: 9px 11px; border: 1px solid var(--line-hi); border-radius: 7px;
    background: var(--card); color: inherit; font: 14px/1.3 var(--sans); min-width: 0;
  }
  input[type=search] { flex: 1 1 240px; }
  .toggle { display: inline-flex; gap: 7px; align-items: center; color: var(--muted); font-size: 13.5px; }
  button.btn {
    font: 500 13.5px/1 var(--sans); padding: 9px 15px; border-radius: 7px;
    border: 1px solid var(--line-hi); background: var(--card); color: var(--text); cursor: pointer;
  }
  button.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-hi); }
  button.btn.primary { background: var(--accent-deep); border-color: var(--accent-deep); color: #fff; }
  button.btn.primary:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn.danger:hover:not(:disabled) { border-color: var(--err); color: var(--err); }
  button.btn:disabled { opacity: .45; cursor: default; }

  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px 20px; }
  .field label { display: block; font: 500 11px/1 var(--mono); letter-spacing: .06em;
                 text-transform: uppercase; color: var(--faint); margin-bottom: 6px; }
  .field select, .field input { width: 100%; }
  .field .ro { padding: 9px 0; font: 14px/1.3 var(--mono); border-bottom: 1px dashed var(--line-hi); }
  .field .n { margin-top: 5px; font-size: 12.5px; color: var(--muted); }
  .field .n.warn { color: var(--warn); }

  /* ── Activity ────────────────────────────────────────────────────────── */

  #toast {
    position: fixed; right: 18px; bottom: 18px; max-width: 380px; z-index: 20;
    display: flex; flex-direction: column; gap: 8px;
  }
  #toast div {
    background: var(--panel); border: 1px solid var(--line-hi); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 10px 13px; font-size: 13.5px;
    box-shadow: 0 18px 44px -22px rgba(0, 0, 0, .85);
  }
  #toast div.good { border-left-color: var(--ok); }
  #toast div.bad { border-left-color: var(--err); }
  .activity { font: 12.5px/1.7 var(--mono); color: var(--muted); }
  .activity div.bad { color: var(--err); }
  .activity div.good { color: var(--ok); }

  .working { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
             background: currentColor; margin-right: 7px; vertical-align: middle; }
  @media (prefers-reduced-motion: no-preference) {
    .working { animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .25; } }
  }

  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; }
    .rail { position: static; min-height: 0; flex-direction: row; align-items: center;
            overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    .rail nav { flex-direction: row; padding: 8px; }
    .rail .foot, .rail .brand .sub, .rail nav .count { display: none; }
    main { padding: 20px 16px 48px; }
    .item { grid-template-columns: 1fr auto; }
  }
</style>

<aside class="rail">
  <div class="brand"><span class="py">Py</span>MCU<span class="sub">Library manager</span></div>
  <nav id="nav">
    <a href="#/project">Project</a>
    <a href="#/libraries">Installed <span class="count" id="c-installed"></span></a>
    <a href="#/registry">Registry <span class="count" id="c-registry"></span></a>
    <a href="#/settings">Settings</a>
  </nav>
  <div class="foot" id="foot"></div>
</aside>

<main id="view"></main>
<div id="toast"></div>

<script>
  const token = new URLSearchParams(location.search).get("token") || "";
  const state = { project: {}, installed: [], index: [], boards: [], source: "", ghost: 0 };
  const view = document.getElementById("view");

  const api = async (path, options = {}) => {
    const res = await fetch(path, {
      ...options,
      headers: { "X-PyMCU-Token": token, "Content-Type": "application/json" },
    });
    const body = await res.json().catch(() => ({ error: res.statusText }));
    if (!res.ok) throw new Error(body.error || res.statusText);
    return body;
  };

  const bytes = (n) => n === null || n === undefined ? "—"
    : n < 1024 ? `${n} B` : `${(n / 1024).toFixed(n < 10240 ? 1 : 0)} KB`;
  const hz = (n) => n ? `${(n / 1e6).toFixed(n % 1e6 ? 1 : 0)} MHz` : "—";
  const esc = (s) => String(s ?? "").replace(/[<>&"]/g, (c) =>
    ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));

  // Python highlighting, carried over from the playground unchanged -- same
  // pattern, same class names, same colours. It runs on the raw source and
  // escapes each slice as it goes, so nothing in a readme can smuggle markup
  // through a token boundary.
  const PY_RX = new RegExp([
    /("""[\s\S]*?"""|'''[\s\S]*?''')/.source,
    /(#[^\n]*)/.source,
    /([fbru]{0,2}"(?:\\.|[^"\\\n])*"|[fbru]{0,2}'(?:\\.|[^'\\\n])*')/.source,
    /(@\w[\w.]*)/.source,
    /\b(def|class|return|if|elif|else|while|for|in|not|and|or|import|from|as|pass|break|continue|True|False|None|with|try|except|finally|raise|lambda|yield|async|await|global|nonlocal|match|case|is|del|assert)\b/.source,
    /\b(uint8|int8|uint16|int16|uint32|int32|float|bool|ptr|const|bytes|bytearray|str|int|list|dict|set|range|len|enumerate|zip|print|input|asm)\b/.source,
    /\b(0[xXbBoO][0-9a-fA-F_]+|\d[\d_]*(?:\.\d+)?(?:[eE][+-]?\d+)?)\b/.source,
  ].join("|"), "g");
  const PY_CLS = [null, "tk-str", "tk-com", "tk-str", "tk-dec", "tk-kw", "tk-type", "tk-num"];

  function highlightPy(source) {
    let out = "", last = 0;
    PY_RX.lastIndex = 0;
    for (let m; (m = PY_RX.exec(source)) !== null;) {
      out += esc(source.slice(last, m.index));
      let cls = null;
      for (let g = 1; g < PY_CLS.length; g++) if (m[g] !== undefined) { cls = PY_CLS[g]; break; }
      out += cls ? `<span class="${cls}">${esc(m[0])}</span>` : esc(m[0]);
      last = m.index + m[0].length;
    }
    return out + esc(source.slice(last));
  }

  // A repository is known by owner/name, not by the URL that reaches it. The
  // full address is still there, on the link, where a browser shows it.
  function repoName(url) {
    try {
      const { hostname, pathname } = new URL(url);
      const parts = pathname.replace(/\.git$/, "").split("/").filter(Boolean);
      if (parts.length >= 2 && /github|gitlab|codeberg|bitbucket/.test(hostname)) {
        return parts.slice(0, 2).join("/");
      }
      return hostname.replace(/^www\./, "") + (parts.length ? "/" + parts.join("/") : "");
    } catch {
      return url;
    }
  }

  const links = (lib) => {
    const items = [];
    if (lib.repository) {
      items.push(`<a class="linkchip" href="${esc(lib.repository)}" target="_blank"
        rel="noopener"><span class="what">Source</span>${esc(repoName(lib.repository))}</a>`);
    }
    if (lib.distribution) {
      items.push(`<a class="linkchip" href="https://pypi.org/project/${encodeURIComponent(lib.distribution)}/"
        target="_blank" rel="noopener"><span class="what">PyPI</span>${esc(lib.distribution)}</a>`);
    }
    if (lib.license) {
      items.push(`<span class="linkchip static"><span class="what">License</span>${esc(lib.license)}</span>`);
    }
    return items.length ? `<div class="links">${items.join("")}</div>` : "";
  };

  // Shell blocks stay plain: a prompt and a command line have nothing worth
  // colouring, and guessing a language we were not told is how snippets end up
  // highlighted as the wrong thing.
  const code = (source, language) => {
    const lang = (language || "").toLowerCase();
    const painted = /^(py|python)$/.test(lang) ? highlightPy(source)
      : esc(source);
    return `<pre class="cmd">${painted}</pre>`;
  };

  // Readmes come from other people's packages: escape everything, then add only
  // the tags we chose. No innerHTML of anything that arrived over the wire.
  function markdown(source, kind) {
    const text = String(source || "").replace(/\r\n/g, "\n");
    if (!text.trim()) return "";
    if ((kind || "").includes("rst") || (kind || "").includes("plain")) {
      return `<pre class="cmd">${esc(text)}</pre>`;
    }

    const inline = (s) => esc(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

    const out = [];
    const lines = text.split("\n");
    let fence = null, fenceLang = "", list = false, para = [];

    const flush = () => {
      if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; }
    };
    const closeList = () => { if (list) { out.push("</ul>"); list = false; } };

    for (const line of lines) {
      const fenced = line.match(/^```(\w*)/);
      if (fenced) {
        if (fence === null) { closeList(); flush(); fence = []; fenceLang = fenced[1]; }
        else { out.push(code(fence.join("\n"), fenceLang)); fence = null; fenceLang = ""; }
        continue;
      }
      if (fence !== null) { fence.push(line); continue; }

      const heading = line.match(/^(#{1,4})\s+(.*)$/);
      if (heading) {
        closeList(); flush();
        const level = Math.min(heading[1].length + 1, 4);
        out.push(`<h${level} class="md">${inline(heading[2])}</h${level}>`);
        continue;
      }
      const bullet = line.match(/^\s*[-*]\s+(.*)$/);
      if (bullet) {
        flush();
        if (!list) { out.push("<ul>"); list = true; }
        out.push(`<li>${inline(bullet[1])}</li>`);
        continue;
      }
      if (!line.trim()) { closeList(); flush(); continue; }
      if (list) { out.push(`<li>${inline(line.trim())}</li>`); continue; }
      para.push(line.trim());
    }
    closeList(); flush();
    if (fence !== null) out.push(code(fence.join("\n"), fenceLang));
    return `<div class="readme">${out.join("\n")}</div>`;
  }

  const activity = [];
  function say(text, kind) {
    activity.push({ text, kind });
    const toast = document.createElement("div");
    if (kind) toast.className = kind;
    toast.textContent = text;
    document.getElementById("toast").append(toast);
    setTimeout(() => toast.remove(), 6000);
  }

  // ---- Data ---------------------------------------------------------------

  async function loadProject() {
    state.project = await api("/api/project");
    const p = state.project;
    document.getElementById("foot").innerHTML =
      `<b>${esc(p.name || "project")}</b>${esc(p.board_label || p.chip_label || "no board set")}`;
  }
  async function loadInstalled() {
    state.installed = (await api("/api/installed")).libraries;
    document.getElementById("c-installed").textContent = state.installed.length || "";
  }
  async function loadIndex(refresh) {
    const data = await api("/api/index" + (refresh ? "?refresh=1" : ""));
    state.index = data.libraries || [];
    state.source = data.source;
    document.getElementById("c-registry").textContent = state.index.length || "";
    if (data.error) say(data.error, "bad");
  }
  // Chip labels ride along with the board list; the registry speaks identifiers.
  const chipLabel = (chip) => {
    for (const group of state.boards) {
      for (const board of group.boards) {
        if (board.chip === chip) return board.chip_label || chip;
      }
    }
    return chip;
  };
  const usedFlash = () => state.installed.reduce((n, l) => n + (l.measured?.flash || 0), 0);
  const find = (name) =>
    state.installed.find((l) => l.name === name) || state.index.find((l) => l.name === name);

  // ---- Views --------------------------------------------------------------

  function flashBlock() {
    const total = state.project.flash_total || 0;
    const used = usedFlash();
    if (!total) return `<div class="n">Flash size unknown for this part.</div>`;
    const pct = (n) => `${Math.min(100, 100 * n / total)}%`;
    return `
      <div class="flash">
        <div class="bar">
          <i style="width:${pct(used)}"></i>
          ${state.ghost ? `<i class="ghost" style="width:${pct(state.ghost)}"></i>` : ""}
        </div>
        <div class="legend">
          <span><b>${bytes(used + state.ghost)}</b> of ${bytes(total)}</span>
          <span>${Math.round(1000 * (used + state.ghost) / total) / 10}%</span>
        </div>
      </div>`;
  }

  function itemRow(lib, { installed }) {
    const flash = lib.measured?.flash;
    const modules = (lib.provides || lib.modules || []).join(", ");
    const fits = installed ? lib.usable : lib.fits;
    return `
      <button class="item ${fits ? "" : "off"}" data-lib="${esc(lib.name)}">
        <span>
          <span class="nm">${esc(lib.name)}<span class="ver">${esc(lib.version || "")}</span></span>
          <span class="desc">${esc(lib.summary || "")}</span>
          <span class="tagline">${modules ? "import " + esc(modules) : ""}${
            fits ? "" : `  ·  <span style="color:var(--err)">${esc((lib.reasons || [])[0] || "does not fit")}</span>`}</span>
        </span>
        <span class="size ${flash ? "" : "na"}">${flash ? bytes(flash) : "—"}</span>
        <span class="chev">›</span>
      </button>`;
  }

  function viewProject() {
    const p = state.project;
    const recent = state.installed.slice(0, 3);
    view.innerHTML = `
      <div class="head"><h1>${esc(p.name || "This project")}</h1></div>
      <p class="lede">${esc(p.root || "")}</p>

      <div class="cards">
        <div class="card">
          <div class="k">Board</div>
          <div class="v">${esc(p.board_label || p.board || p.target || "not set")}</div>
          <div class="n">${esc(p.chip_label || p.chip || "no chip resolved")}${
            p.board ? ` · <span style="font-family:var(--mono)">${esc(p.board)}</span>` : ""}</div>
        </div>
        <div class="card">
          <div class="k">API layer</div>
          <div class="v">${esc(p.layer || "native")}</div>
          <div class="n">${p.layer === "micropython" ? "machine, time"
            : p.layer === "circuitpython" ? "board, digitalio" : "pymcu.hal"}</div>
        </div>
        <div class="card">
          <div class="k">Clock</div>
          <div class="v mono">${hz(p.frequency)}</div>
          <div class="n">${p.frequency_explicit ? "set in pyproject.toml" : "board default"}</div>
        </div>
        <div class="card">
          <div class="k">Flash used by libraries</div>
          <div class="v mono">${bytes(usedFlash())}</div>
          ${flashBlock()}
        </div>
      </div>

      <h2>Libraries</h2>
      <div class="list">
        ${recent.length ? recent.map((l) => itemRow(l, { installed: true })).join("") :
          `<div class="empty"><p>No libraries in this project yet.</p>
           <button class="btn primary" data-go="#/registry">Browse the registry</button></div>`}
      </div>
      ${state.installed.length > 3
        ? `<p style="margin-top:10px"><a href="#/libraries">See all ${state.installed.length}</a></p>` : ""}

      ${activity.length ? `<h2>Recent activity</h2><div class="activity">${
        activity.slice(-8).map((a) => `<div class="${a.kind || ""}">${esc(a.text)}</div>`).join("")
      }</div>` : ""}`;
  }

  function viewInstalled() {
    view.innerHTML = `
      <div class="head"><h1>Installed</h1></div>
      <p class="lede">Libraries in this project's environment. The compiler reads their
        sources at build time; nothing here runs on the chip.</p>
      <div class="list">
        ${state.installed.length ? state.installed.map((l) => itemRow(l, { installed: true })).join("")
          : `<div class="empty"><p>Nothing installed yet.</p>
             <button class="btn primary" data-go="#/registry">Browse the registry</button></div>`}
      </div>`;
  }

  function viewRegistry() {
    const query = sessionStorage.getItem("q") || "";
    const q = query.toLowerCase();
    const all = sessionStorage.getItem("all") === "1";
    const here = new Set(state.installed.map((l) => l.name));
    const rows = state.index
      .filter((l) => !here.has(l.name))
      .filter((l) => all || l.fits)
      .filter((l) => !q || `${l.name} ${l.summary} ${(l.categories || []).join(" ")}`.toLowerCase().includes(q));

    view.innerHTML = `
      <div class="head"><h1>Registry</h1></div>
      <p class="lede">Libraries known to compile for PyMCU, from
        <span class="pill">${esc(state.source || "index")}</span>.
        Compatibility is measured by building each one, not declared.</p>
      <div class="bar-row">
        <input type="search" id="q" placeholder="Search by name or purpose" value="${esc(query)}">
        <label class="toggle"><input type="checkbox" id="all" ${all ? "checked" : ""}> Show what doesn't fit</label>
        <button class="btn" id="refresh">Refresh</button>
      </div>
      <div class="list">
        ${rows.length ? rows.map((l) => itemRow(l, { installed: false })).join("")
          : `<div class="empty"><p>${
              q ? "Nothing matches that search."
                : state.index.length && here.size >= state.index.length
                  ? `Everything the registry has for the ${esc(state.project.board_label || state.project.chip)} is already installed.`
                  : state.index.length ? `Nothing else fits the ${esc(state.project.board_label || state.project.chip)}.`
                  : "The registry is empty. It fills as libraries are published."
            }</p></div>`}
      </div>`;

    document.getElementById("q").oninput = (event) => {
      sessionStorage.setItem("q", event.target.value);
      const at = window.scrollY;
      viewRegistry();
      const field = document.getElementById("q");
      field.focus();
      field.setSelectionRange(field.value.length, field.value.length);
      window.scrollTo(0, at);
    };
    document.getElementById("all").onchange = (event) => {
      sessionStorage.setItem("all", event.target.checked ? "1" : "0");
      viewRegistry();
    };
    document.getElementById("refresh").onclick = async (event) => {
      event.target.disabled = true;
      try { await loadIndex(true); say("Registry refreshed."); }
      catch (err) { say(String(err.message || err), "bad"); }
      viewRegistry();
    };
  }

  function viewLibrary(name, tab = "overview") {
    const lib = find(name);
    if (!lib) { location.hash = "#/registry"; return; }
    const installed = state.installed.some((l) => l.name === name);
    const fits = installed ? lib.usable : lib.fits;
    const targets = lib.measured?.targets || {};
    const flash = lib.measured?.flash;
    const modules = lib.provides || lib.modules || [];

    const panes = {
      overview: () => `
        <div class="cards">
          <div class="card"><div class="k">Flash on ${esc(state.project.chip)}</div>
            <div class="v mono" style="color:var(--copper-bright)">${bytes(flash)}</div>
            <div class="n">${flash ? "measured by compiling its example" : "not measured on this chip"}</div></div>
          <div class="card"><div class="k">Import</div>
            <div class="v mono">${esc(modules[0] || "—")}</div>
            <div class="n">${modules.length > 1 ? "also " + esc(modules.slice(1).join(", ")) : "&nbsp;"}</div></div>
          <div class="card"><div class="k">Written against</div>
            <div class="v">${esc(lib.layer || "native")}</div>
            <div class="n">${(lib.adapters || []).length
              ? "adapters: " + esc((lib.adapters || []).join(", ")) : "no layer adapters"}</div></div>
        </div>
        ${links(lib)}
        ${lib.readme ? `<h2>Readme</h2>${markdown(lib.readme, lib.readme_type)}`
          : `<h2>Readme</h2><p class="lede">This library ships no long description.</p>`}`,

      compatibility: () => `
        <p class="lede">Every figure comes from compiling this library's own example for
          that chip. Where it says no, the build failed — which is the answer the
          registry exists to give.</p>
        <table class="matrix">
          <tr><th>Chip</th><th>Build</th><th>Flash</th></tr>
          ${Object.entries(targets).map(([chip, r]) => `
            <tr>
              <td class="n">${esc(chipLabel(chip))}${chip === state.project.chip
                ? ' <span class="pill">this board</span>' : ""}</td>
              <td><span class="pill ${r.build === "ok" ? "ok" : "no"}">${esc(r.build)}</span></td>
              <td class="n">${r.build === "ok" ? bytes(r.flash) : "—"}</td>
            </tr>`).join("") || `<tr><td colspan="3">Not measured yet.</td></tr>`}
        </table>
        ${lib.measured?.compiler ? `<p class="lede" style="margin-top:12px">Measured with
          pymcu-compiler ${esc(lib.measured.compiler)} on ${esc(lib.measured.date)}.</p>` : ""}`,

      usage: () => {
        const example = lib.example || {};
        const layer = state.project.layer || "native";
        const adapter = (lib.adapters || []).includes(layer);
        return `
        <h2>Import</h2>
        ${code(`from ${modules[0] || lib.name} import ...`, "python")}
        <p class="lede">${
          lib.layer === layer
            ? `Written against the ${esc(layer)} layer, which is the one this project declares.`
            : adapter
              ? `This project declares the ${esc(layer)} layer, so the ${esc(layer)} adapter is what gets compiled — the API follows ${esc(layer)}, not ${esc(lib.layer)}.`
              : `Written against the ${esc(lib.layer)} layer; this project declares ${esc(layer)}.`
        }</p>
        ${example.source ? `
          <h2>Example${example.name ? ` · ${esc(example.name)}` : ""}</h2>
          <p class="lede">The library's own example — the same file the registry
            compiles to measure it.${lib.layer !== layer
              ? ` It is written against the ${esc(lib.layer)} API; on the ${esc(layer)}
                  layer the calls follow ${esc(layer)}'s own conventions.` : ""}</p>
          ${code(example.source, "python")}`
          : `<h2>Example</h2><p class="lede">This library ships no example.</p>`}`;
      },
    };

    view.innerHTML = `
      <a class="back" href="#/${installed ? "libraries" : "registry"}">‹ ${installed ? "Installed" : "Registry"}</a>
      <div class="head">
        <h1>${esc(lib.name)}</h1>
        <span class="pill">${esc(lib.version || "")}</span>
        ${fits ? `<span class="pill ok">fits the ${esc(state.project.board_label || state.project.chip_label || state.project.chip)}</span>`
                : `<span class="pill no">${esc((lib.reasons || [])[0] || "does not fit")}</span>`}
      </div>
      <p class="lede">${esc(lib.summary || "")}</p>
      <div class="bar-row">
        ${installed
          ? `<button class="btn danger" data-act="uninstall" data-name="${esc(lib.name)}">Remove</button>`
          : `<button class="btn primary" data-act="install" data-name="${esc(lib.name)}" ${fits ? "" : "disabled"}>Install</button>`}
        <span class="cli">or <code>pymcu ${installed ? "uninstall" : "install"} ${esc(lib.name)}</code>${
          lib.distribution ? ` · <code>${esc(lib.distribution)}</code> on PyPI` : ""}</span>
      </div>
      <div class="tabs" role="tablist">
        ${["overview", "compatibility", "usage"].map((t) =>
          `<button role="tab" aria-selected="${t === tab}" data-tab="${t}">${t[0].toUpperCase() + t.slice(1)}</button>`).join("")}
      </div>
      <div>${panes[tab]()}</div>`;

    view.querySelectorAll("[data-tab]").forEach((button) => {
      button.onclick = () => viewLibrary(name, button.dataset.tab);
    });
  }

  function viewSettings() {
    const p = state.project;
    const groups = state.boards.map((g) => `
      <optgroup label="${esc(g.group)}">
        ${g.boards.map((b) => `<option value="${esc(b.name)}" data-freq="${b.frequency}"
          data-chip="${esc(b.chip)}" ${b.name === p.board ? "selected" : ""}>${esc(b.name)}</option>`).join("")}
      </optgroup>`).join("");

    view.innerHTML = `
      <div class="head"><h1>Settings</h1></div>
      <p class="lede">What the build uses. Saving writes only these keys into
        <span class="pill">[tool.pymcu]</span>; the rest of pyproject.toml is left as you wrote it.</p>

      <div class="fields">
        <div class="field"><label for="f-board">Board</label>
          <select id="f-board"><option value="">— not set —</option>${groups}</select>
          <div class="n">${p.target && !p.board
            ? `Currently a bare target: ${esc(p.target)}.` : "Sets the chip and its clock."}</div></div>

        <div class="field"><label for="f-layer">API layer</label>
          <select id="f-layer">
            <option value="native">native — pymcu.hal</option>
            <option value="micropython">micropython — machine, time</option>
            <option value="circuitpython">circuitpython — board, digitalio</option>
          </select>
          <div class="n" id="n-layer"></div></div>

        <div class="field"><label for="f-freq">Clock (Hz)</label>
          <input type="number" id="f-freq" min="1" value="${p.frequency || ""}">
          <div class="n" id="n-freq"></div></div>

        <div class="field"><label>Chip</label>
          <div class="ro" id="d-chip">${esc(p.chip_label || p.chip || "—")}</div>
          <div class="n">Follows from the board.</div></div>

        <div class="field"><label for="f-sources">Sources</label>
          <input type="text" id="f-sources" value="${esc(p.sources || "src")}">
          <div class="n ${p.sources_exist ? "" : "warn"}">${p.sources_exist ? "" : "This folder does not exist."}</div></div>

        <div class="field"><label for="f-entry">Entry point</label>
          <input type="text" id="f-entry" value="${esc(p.entry || "main.py")}">
          <div class="n ${p.entry_exists ? "" : "warn"}">${p.entry_exists ? "" : "No such file under sources."}</div></div>

        <div class="field"><label>Toolchain</label>
          <div class="ro">${esc(p.toolchain || "—")}</div>
          <div class="n">Chosen by the chip family.</div></div>

        <div class="field"><label>Programmer</label>
          <div class="ro">${esc(p.programmer || "—")}</div>
          <div class="n">${p.programmer_explicit ? "Set under [tool.pymcu.flash]." : "Default for this chip."}</div></div>
      </div>

      <div class="bar-row" style="margin-top:22px">
        <button class="btn primary" id="save">Save</button>
        <button class="btn" id="discard">Discard</button>
      </div>`;

    document.getElementById("f-layer").value = p.layer || "native";
    const layerNote = () => {
      const value = document.getElementById("f-layer").value;
      document.getElementById("n-layer").textContent = value === "native"
        ? "Libraries use pymcu.hal directly."
        : `Needs pymcu-${value} installed in this project.`;
    };
    const freqNote = () => {
      const value = Number(document.getElementById("f-freq").value);
      document.getElementById("n-freq").textContent = value > 0
        ? `${hz(value)}${value === p.frequency
            ? (p.frequency_explicit ? " · set in pyproject.toml" : " · board default") : " · unsaved"}`
        : "Must be a positive number of hertz.";
    };
    layerNote(); freqNote();
    document.getElementById("f-layer").onchange = layerNote;
    document.getElementById("f-freq").oninput = freqNote;

    // A board carries its own clock: one left over from another board compiles
    // and makes every delay wrong.
    document.getElementById("f-board").onchange = (event) => {
      const option = event.target.selectedOptions[0];
      if (option?.dataset.freq) {
        document.getElementById("f-freq").value = option.dataset.freq;
        document.getElementById("d-chip").textContent = option.dataset.chip;
        freqNote();
      }
    };
    document.getElementById("discard").onclick = () => viewSettings();
    document.getElementById("save").onclick = async (event) => {
      event.target.disabled = true;
      try {
        const result = await api("/api/config", {
          method: "POST",
          body: JSON.stringify({
            board: document.getElementById("f-board").value || undefined,
            layer: document.getElementById("f-layer").value,
            frequency: Number(document.getElementById("f-freq").value) || undefined,
            sources: document.getElementById("f-sources").value.trim() || undefined,
            entry: document.getElementById("f-entry").value.trim() || undefined,
          }),
        });
        state.project = result.project;
        state.installed = result.installed;
        await loadIndex();
        say(Object.keys(result.changed || {}).length
          ? `Saved: ${Object.entries(result.changed).map(([k, v]) => `${k}=${v}`).join(", ")}`
          : result.message, "good");
      } catch (err) {
        say(String(err.message || err), "bad");
      }
      await loadProject();
      await loadInstalled();
      viewSettings();
    };
  }

  // ---- Actions ------------------------------------------------------------

  async function change(kind, name, button) {
    button.disabled = true;
    button.innerHTML = `<span class="working"></span>${kind === "install" ? "Installing" : "Removing"}…`;
    try {
      const result = await api(`/api/${kind}`, { method: "POST", body: JSON.stringify({ name }) });
      (result.log || []).forEach((line) => activity.push({ text: line }));
      say(result.message, result.ok ? "good" : "bad");
      state.installed = result.installed;
      state.project = result.project;
      document.getElementById("c-installed").textContent = state.installed.length || "";
      await loadIndex();
    } catch (err) {
      say(String(err.message || err), "bad");
    }
    route();
  }

  // ---- Router -------------------------------------------------------------

  function route() {
    const hash = location.hash || "#/project";
    // A library page belongs to wherever you would have come from: the
    // installed list if you have it, the registry if you do not.
    const libraryHome = hash.startsWith("#/library/") &&
      state.installed.some((l) => l.name === decodeURIComponent(hash.slice(10)))
        ? "#/libraries" : "#/registry";
    document.querySelectorAll("#nav a").forEach((a) => {
      const target = a.getAttribute("href");
      const active = hash === target ||
        (hash.startsWith("#/library/") && target === libraryHome);
      if (active) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });

    if (hash.startsWith("#/library/")) viewLibrary(decodeURIComponent(hash.slice(10)));
    else if (hash === "#/libraries") viewInstalled();
    else if (hash === "#/registry") viewRegistry();
    else if (hash === "#/settings") viewSettings();
    else viewProject();
    window.scrollTo(0, 0);
  }

  document.addEventListener("click", (event) => {
    const go = event.target.closest("[data-go]");
    if (go) { location.hash = go.dataset.go; return; }

    const act = event.target.closest("[data-act]");
    if (act) { change(act.dataset.act, act.dataset.name, act); return; }

    const item = event.target.closest("[data-lib]");
    if (item) location.hash = "#/library/" + encodeURIComponent(item.dataset.lib);
  });

  // On the project view, hovering a library previews what it would add.
  document.addEventListener("mouseover", (event) => {
    if (location.hash !== "#/project" && location.hash !== "") return;
    const item = event.target.closest("[data-lib]");
    const lib = item && find(item.dataset.lib);
    const cost = lib && !state.installed.some((l) => l.name === lib.name)
      ? lib.measured?.flash || 0 : 0;
    if (cost !== state.ghost) { state.ghost = cost; viewProject(); }
  });

  window.addEventListener("hashchange", route);

  (async function boot() {
    try {
      await loadProject();
      state.boards = (await api("/api/boards")).groups || [];
      await loadInstalled();
      await loadIndex();
    } catch (err) {
      say(String(err.message || err), "bad");
    }
    route();
  })();
</script>
