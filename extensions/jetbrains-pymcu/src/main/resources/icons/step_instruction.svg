<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
  <!-- Step arrow (right-pointing play) -->
  <polygon points="3,3 3,13 11,8" fill="#6CAF4F"/>
  <!-- Vertical bar (step marker) -->
  <rect x="12" y="3" width="2" height="10" fill="#6CAF4F"/>
  <!-- Small chip dots underneath to indicate "instruction level" -->
  <rect x="5" y="14" width="1.5" height="1.5" fill="#6CAF4F" opacity="0.6"/>
  <rect x="7.5" y="14" width="1.5" height="1.5" fill="#6CAF4F" opacity="0.6"/>
  <rect x="10" y="14" width="1.5" height="1.5" fill="#6CAF4F" opacity="0.6"/>
</svg>
