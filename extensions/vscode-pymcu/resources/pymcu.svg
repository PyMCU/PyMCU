<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
  <!-- PCB board outline -->
  <rect x="1" y="3" width="14" height="10" rx="1" ry="1" fill="none" stroke="currentColor" stroke-width="1"/>
  <!-- CPU chip -->
  <rect x="5" y="5" width="6" height="6" rx="0.5" ry="0.5"/>
  <!-- Pin left -->
  <line x1="1" y1="6" x2="5" y2="6" stroke="currentColor" stroke-width="1"/>
  <line x1="1" y1="8" x2="5" y2="8" stroke="currentColor" stroke-width="1"/>
  <line x1="1" y1="10" x2="5" y2="10" stroke="currentColor" stroke-width="1"/>
  <!-- Pin right -->
  <line x1="11" y1="6" x2="15" y2="6" stroke="currentColor" stroke-width="1"/>
  <line x1="11" y1="8" x2="15" y2="8" stroke="currentColor" stroke-width="1"/>
  <line x1="11" y1="10" x2="15" y2="10" stroke="currentColor" stroke-width="1"/>
  <!-- Pin top -->
  <line x1="7" y1="3" x2="7" y2="5" stroke="currentColor" stroke-width="1"/>
  <line x1="9" y1="3" x2="9" y2="5" stroke="currentColor" stroke-width="1"/>
  <!-- Pin bottom -->
  <line x1="7" y1="11" x2="7" y2="13" stroke="currentColor" stroke-width="1"/>
  <line x1="9" y1="11" x2="9" y2="13" stroke="currentColor" stroke-width="1"/>
</svg>
