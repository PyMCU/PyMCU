[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "pymcu-compiler"
version = "0.1.0a10"
description = "Python-to-MCU compiler driver"
readme = "README.md"
authors = [
    { name = "Iván Montiel Cardona", email = "contact@pymcu.org" }
]
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12.0",
    "tomlkit>=0.12.0",
    "rich>=13.0.0",
    "questionary>=2.0",
    "packaging>=23.0",
    # Every HTTPS request this driver makes -- toolchains, the library index,
    # sdists -- fails with CERTIFICATE_VERIFY_FAILED on a python.org macOS
    # build until the user runs Install Certificates.command. The code already
    # preferred certifi when it happened to be installed; depending on it
    # removes a whole class of errors that read like the server being down.
    "certifi>=2023.7.22",
    "pymcu-stdlib>=0.1.0a10",
    "pymcu-sdk>=0.1.0a9",
]

[project.optional-dependencies]
avr = ["pymcu-avr>=0.1.0a9"]
arm = ["pymcu-arm>=0.1.0a4"]
pic = ["pymcu-pic>=0.1.0a3"]
# No `riscv` extra yet: pymcu-backend-riscv is not on PyPI, and an extra that
# cannot resolve fails harder than a missing one (pip only warns about an
# unknown extra, and `pymcu build` already points at the install command).
# Restore it here, and in `all`, once the package is published.
all = ["pymcu-avr>=0.1.0a9", "pymcu-arm>=0.1.0a4", "pymcu-pic>=0.1.0a3"]

[tool.uv.sources]
pymcu-stdlib = {path = "lib", editable = true}
pymcu-sdk = {path = "extensions/pymcu-sdk", editable = true}
pymcu-backend-riscv = {path = "extensions/pymcu-backend-riscv", editable = true}

[project.scripts]
pymcu = "driver.main:run_cli"

[project.entry-points."pymcu.programmers"]
avrdude = "driver.programmers.avrdude:AvrdudeProgrammer"
pk2cmd  = "driver.programmers.pk2cmd:Pk2cmdProgrammer"
ipecmd  = "driver.programmers.ipecmd:IpecmdProgrammer"

[tool.hatch.build.targets.wheel]
packages = ["src/driver"]
# Include the native binary as a non-Python artifact
artifacts = ["src/driver/pymcuc", "src/driver/pymcuc.exe"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src/", "hatch_build.py"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "extensions/pymcu-sdk/src",
]
addopts = ["--import-mode=importlib"]
