[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "pymcu-compiler"
version = "0.1.0a1.post1"
description = "Python-to-MCU compiler driver"
readme = "README.md"
authors = [
    { name = "Iván Montiel Cardona", email = "contact@pymcu.org" }
]
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12.0",
    "tomlkit>=0.12.0",
    "rich>=13.0.0",
    "questionary>=2.0",
    "packaging>=23.0",
    "pymcu-stdlib>=0.1.0a1",
    "pymcu-sdk>=0.1.0a1",
]

[project.optional-dependencies]
avr = ["pymcu-avr>=0.1.0a1"]
arm = ["pymcu-arm>=0.1.0a1.post0"]
pic = ["pymcu-toolchain-pic>=0.1.0a1"]
all = ["pymcu-avr>=0.1.0a1", "pymcu-arm>=0.1.0a1.post0"]

[tool.uv.sources]
pymcu-stdlib = {path = "lib", editable = true}
pymcu-sdk = {path = "extensions/pymcu-sdk", editable = true}
pymcu-toolchain-pic = {path = "extensions/pymcu-toolchain-pic", editable = true}

[project.scripts]
pymcu = "driver.main:run_cli"

[project.entry-points."pymcu.programmers"]
avrdude = "driver.programmers.avrdude:AvrdudeProgrammer"
pk2cmd  = "driver.programmers.pk2cmd:Pk2cmdProgrammer"

[tool.hatch.build.targets.wheel]
packages = ["src/driver"]
# Include the native binary as a non-Python artifact
artifacts = ["src/driver/pymcuc", "src/driver/pymcuc.exe"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src/", "hatch_build.py"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "extensions/pymcu-sdk/src",
    "extensions/pymcu-toolchain-pic/src",
]
addopts = ["--import-mode=importlib"]
