# Each [[deviation]] is one HAL parity symbol or compatibility-layer file/line
# pattern the parity suite does not require to be clean yet.
#
# `status` follows the compatibility parity allowlist schema:
#   - "documented": intentional behavior described in docs.
#   - "tracked:#N": a real gap filed in the repository that owns it.
#
# `text` (compat.* entries only) is the offending source line, whitespace-
# normalised. A pinned release can shift line numbers, so an entry matches a
# violation on file + line number OR on file + line text.

