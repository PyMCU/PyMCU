---
name: Feature request / language enhancement
description: Propose a new language feature, HAL API, optimization, or CLI capability
title: "[Feature]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape PyMCU! Use this for language/compiler features,
        new HAL or driver APIs, optimizations, and tooling improvements.

        > [!TIP]
        > Check the [language roadmap and limitations](https://github.com/PyMCU/PyMCU/tree/main/docs)
        > and [existing issues](https://github.com/PyMCU/PyMCU/issues?q=is%3Aissue)
        > first — it may already be planned or under discussion.

  - type: dropdown
    attributes:
      label: Area
      options:
        - Language / syntax
        - Compiler / optimization / code generation
        - Standard library & HAL (pymcu-stdlib)
        - A backend (AVR / PIC / RISC-V / PIO)
        - CircuitPython compatibility layer
        - MicroPython compatibility layer
        - CLI / tooling (build, flash, debug)
        - IDE integration (JetBrains / VS Code)
        - Other
    validations:
      required: true

  - type: textarea
    attributes:
      label: Problem / motivation
      description: What can't you do today, or what is awkward? Describe the use case, not just the solution.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed solution
      description: |
        What should the API or behavior look like? If it's a language/HAL feature,
        show the PyMCU code you'd like to write.
      render: python
    validations:
      required: true

  - type: textarea
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds you use today, or how other tools (Arduino, MicroPython, CircuitPython) handle it.
    validations:
      required: false

  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
