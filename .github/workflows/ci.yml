name: CI

on:
  push:
    branches: ["main", "develop", "development", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  unit:
    name: Unit Tests (.NET)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore packages
        run: dotnet restore tests/unit/PyMCU.Tests.csproj --nologo

      - name: Run unit tests
        run: |
          dotnet test tests/unit/PyMCU.Tests.csproj \
            --no-restore \
            --logger "trx;LogFileName=unit-results.trx" \
            --logger "console;verbosity=normal" \
            --collect:"XPlat Code Coverage" \
            --results-directory test-results \
            --nologo

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results/
          retention-days: 15

  driver-tests:
    name: Driver Tests (Python)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-11-arm exercises the driver on Windows on Arm (public repos only).
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install driver dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-mock tomlkit rich typer questionary pyyaml
          pip install ./extensions/pymcu-sdk
          # In-tree stdlib: the driver's library-compat checks import pymcu.chips.
          pip install --no-deps ./lib
          # External PIC backend: provides pymcu.toolchain.pic for the driver
          # toolchain tests. --no-deps so the in-tree SDK above is not shadowed.
          pip install --pre --no-deps pymcu-pic
          # External AVR backend: the arena tests build a project whose target is
          # atmega328p, so mock_toolchain has nothing to patch without it and the
          # build dies on "No toolchain found for chip 'atmega328p'". It also
          # un-skips five pytest.importorskip("pymcu.toolchain.avr") sites in
          # test_build.py and test_pgo.py. Same --pre --no-deps as the PIC one.
          pip install --pre --no-deps pymcu-avr

      - name: Run driver tests
        run: pytest tests/driver/ -v --tb=short

  stdlib-parity:
    name: HAL Parity (ast-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install pytest
          # Compat layers for the universality half of the parity scan; only
          # prereleases exist on PyPI, and --no-deps keeps the in-tree
          # lib/src/pymcu the only stdlib the scan sees.
          pip install --pre --no-deps pymcu-circuitpython pymcu-micropython

      # Before the scan, not after: a layer older than this tree fails the scan
      # as four violations naming files and lines, which reads as a parity bug
      # and is not one. This says so in one line instead, and goes quiet on its
      # own when the layer publishes.
      - name: Check the published layers are not older than this tree
        run: python tools/check_compat_layer_versions.py

      # Pure ast/tomllib over lib/src/pymcu, no compiler and no stdlib install
      # needed. The compat layers installed above let the universality half of
      # hal_parity.py run against the pinned PyPI releases instead of skipping.
      - name: Run HAL parity tests
        run: pytest tests/stdlib/test_hal_parity.py tests/stdlib/test_inline_host_overloads.py -v --tb=short

  stdlib:
    name: Stdlib Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install pytest
          # Compat layers for the HAL parity universality check in
          # tests/stdlib/test_hal_parity.py (see the stdlib-parity job).
          pip install --pre --no-deps pymcu-circuitpython pymcu-micropython
          # tests/stdlib/test_a_cited_line_is_the_readers_line.py runs the whole
          # `pymcu build` in a subprocess, because the preamble it is about is
          # injected by the DRIVER and never exists when pymcuc is called alone.
          # That subprocess needs everything the driver needs, in four layers it
          # hits one after another: the CLI packages, the toolchain SDK, a
          # backend that claims atmega328p, and a pymcu.chips to bootstrap from.
          pip install pytest-mock tomlkit rich typer questionary pyyaml
          pip install ./extensions/pymcu-sdk
          pip install --pre --no-deps pymcu-avr
          pip install --no-deps ./lib

      # The suite carries tests/stdlib/test_hal_parity.py too, so it hits the
      # same stale-layer failure. Same check, same reason (see stdlib-parity).
      - name: Check the published layers are not older than this tree
        run: python tools/check_compat_layer_versions.py

      # The suite drives build/bin/pymcuc with --emit-ir, which replaces the
      # backend phase with the IR serializer, so no backend binary is needed --
      # except in the one file above, which goes through `pymcu build`.
      - name: Build the compiler
        run: dotnet publish src/compiler/PyMCU.csproj -c Release -o build/bin --nologo

      - name: Run stdlib tests
        run: python -m pytest tests/stdlib -q
