name: CI

on:
  push:
    branches: ["main", "develop", "development", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  unit:
    name: Unit Tests (.NET)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore packages
        run: dotnet restore tests/unit/PyMCU.Tests.csproj --nologo

      - name: Run unit tests
        run: |
          dotnet test tests/unit/PyMCU.Tests.csproj \
            --no-restore \
            --logger "trx;LogFileName=unit-results.trx" \
            --logger "console;verbosity=normal" \
            --collect:"XPlat Code Coverage" \
            --results-directory test-results \
            --nologo

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results/
          retention-days: 15

  driver-tests:
    name: Driver Tests (Python)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-11-arm exercises the driver on Windows on Arm (public repos only).
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install driver dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-mock tomlkit rich typer questionary
          pip install ./extensions/pymcu-sdk
          # External PIC backend: provides pymcu.toolchain.pic for the driver
          # toolchain tests. --no-deps so the in-tree SDK above is not shadowed.
          pip install --pre --no-deps pymcu-pic

      - name: Run driver tests
        run: pytest tests/driver/ -v --tb=short
