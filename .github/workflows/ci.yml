name: CI

on:
  push:
    branches: ["main", "develop", "development", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  unit:
    name: Unit Tests (.NET)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore packages
        run: dotnet restore tests/unit/PyMCU.Tests.csproj --nologo

      - name: Run unit tests
        run: |
          dotnet test tests/unit/PyMCU.Tests.csproj \
            --no-restore \
            --logger "trx;LogFileName=unit-results.trx" \
            --logger "console;verbosity=normal" \
            --collect:"XPlat Code Coverage" \
            --results-directory test-results \
            --nologo

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results/
          retention-days: 15

  driver-tests:
    name: Driver Tests (Python)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-11-arm exercises the driver on Windows on Arm (public repos only).
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install driver dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-mock tomlkit rich typer questionary
          pip install ./extensions/pymcu-sdk
          # In-tree stdlib: the driver's library-compat checks import pymcu.chips.
          pip install --no-deps ./lib
          # External PIC backend: provides pymcu.toolchain.pic for the driver
          # toolchain tests. --no-deps so the in-tree SDK above is not shadowed.
          pip install --pre --no-deps pymcu-pic

      - name: Run driver tests
        run: pytest tests/driver/ -v --tb=short

  stdlib-parity:
    name: HAL Parity (ast-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install pytest

      # Pure ast/tomllib over lib/src/pymcu, no compiler and no stdlib install
      # needed. hal_parity.py also cross-checks the circuitpython/micropython
      # compat layers, but only when those sibling repos are checked out at
      # the maintainer's local absolute paths (LAYERS in hal_parity.py); on a
      # CI runner those paths never exist, so that half of the check is
      # skipped here and this job only covers the in-tree HAL surface.
      - name: Run HAL parity tests
        run: pytest tests/stdlib/test_hal_parity.py tests/stdlib/test_inline_host_overloads.py -v --tb=short

  oracle:
    name: Oracle Suite (AVR8Sharp NuGet)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: PyMCU

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: PyMCU

      - name: Checkout AVR backend
        uses: actions/checkout@v4
        with:
          repository: PyMCU/pymcu-avr
          path: pymcu-avr

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: PyMCU/global.json

      - name: Build compiler, backend and NuGet oracle runner
        run: |
          dotnet publish src/compiler/PyMCU.csproj -c Release -o build/bin --nologo
          dotnet publish ../pymcu-avr/src/csharp/cli/PyMCU.Backend.AVR.Cli.csproj -c Release -o ../pymcu-avr/build/bin --nologo
          dotnet build tests/oracle/runner/PyMCU.OracleRunner.csproj -c Release -o build/oracle --nologo

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install beta source packages and AVR toolchain
        run: |
          uv venv .venv
          uv pip install --python .venv --no-sources pytest -e lib -e extensions/pymcu-sdk -e . -e ../pymcu-avr

      - name: Run oracle suite
        env:
          PYMCU_BIN: ${{ github.workspace }}/PyMCU/.venv/bin/pymcu
          PYMCU_BACKEND_BINARY: avr=${{ github.workspace }}/pymcu-avr/build/bin/pymcuc-avr
          PYMCU_ORACLE_RUNNER: ${{ github.workspace }}/PyMCU/build/oracle/PyMCU.OracleRunner.dll
        run: .venv/bin/python -m pytest tests/oracle -v --tb=short --junitxml=oracle-results.xml

      - name: Upload oracle results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-test-results
          path: PyMCU/oracle-results.xml
          retention-days: 15
