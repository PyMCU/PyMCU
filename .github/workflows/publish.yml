name: Publish Wheels

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # Classifies the triggering ref: stable tag, pre-release tag, or no tag
  # (manual dispatch without a tag — wheels are built but nothing is published).
  check-tag:
    name: Detect release type
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is_stable: ${{ steps.tag.outputs.is_stable }}
      is_prerelease: ${{ steps.tag.outputs.is_prerelease }}
    steps:
      - name: Classify tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME:-}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true"     >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "is_stable=false"    >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true"  >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false"    >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # One native job per platform — produces a single py3-none-<platform> wheel
  # per OS/arch. pymcuc is a .NET AOT binary with no Python ABI dependency, so
  # there is no need to build one wheel per Python version.
  #
  build-wheels:
    name: Build wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          # The tag must be pinned: without it hatch_build falls back to
          # sysconfig.get_platform(), which reports whatever macOS the runner
          # happens to be on. macos-latest moved to macOS 26 and stamped the
          # 0.1.0a4 wheels macosx_26_0_arm64, so pip on macOS 14/15 found no
          # candidate at all. 14.0 is the floor .NET 10 supports and the one
          # pymcu-avr-toolchain already publishes.
          - name: macos-arm64
            os: macos-latest
            wheel_platform_tag: macosx_14_0_arm64
          - name: windows-x64
            os: windows-latest
          # Native arm64 build on a GitHub-hosted Windows on Arm runner (GA &
          # free for public repos since Aug 2025). sysconfig.get_platform()
          # resolves the wheel tag to win_arm64 automatically, and hatch_build.py
          # publishes with -r win-arm64. NOTE: windows-11-arm runners are only
          # available on public repositories. For a private repo, drop this entry
          # and cross-compile from windows-latest with DOTNET_RID=win-arm64 +
          # WHEEL_PLATFORM_TAG=win_arm64 (requires the VS 2022 C++ ARM64 build tools).
          - name: windows-arm64
            os: windows-11-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheel
        env:
          DOTNET_RID: ${{ matrix.dotnet_rid }}
          WHEEL_PLATFORM_TAG: ${{ matrix.wheel_platform_tag }}
        run: uv build --wheel

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*.whl
          retention-days: 15

  # Pure-Python wheels for the packages that live in this repo alongside the
  # compiler: pymcu-stdlib (lib/) and pymcu-sdk (extensions/pymcu-sdk/). One
  # build on one platform covers everything (py3-none-any).
  build-pure-wheels:
    name: Build pure wheels (stdlib + sdk)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build pymcu-stdlib wheel
        run: uv build --wheel --project lib -o dist

      - name: Build pymcu-sdk wheel
        run: uv build --wheel --project extensions/pymcu-sdk -o dist

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-pure
          path: dist/*.whl
          retention-days: 15

  # Runs on any release — stable (vX.Y.Z) or pre-release (e.g. v0.1.0a1).
  # The public alpha ships on real PyPI so `pip install --pre pymcu-compiler[avr]`
  # resolves the whole set; TestPyPI is reserved for manual dispatch smoke tests.
  publish-pypi:
    name: Publish to PyPI
    needs: [check-tag, build-wheels, build-pure-wheels]
    if: needs.check-tag.outputs.is_stable == 'true' || needs.check-tag.outputs.is_prerelease == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        # skip-existing makes retries idempotent by FILENAME: files already on
        # PyPI from a partially-successful earlier attempt are skipped. (An
        # uv publish --check-url retry would fail instead: the AOT rebuild is
        # not bit-for-bit reproducible, so the hashes never match.)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  # Manual smoke-test channel: a workflow_dispatch run (no tag) publishes to
  # TestPyPI. Pre-release tags now go to real PyPI via publish-pypi, so this no
  # longer fires on tags.
  publish-testpypi:
    name: Publish to TestPyPI
    needs: [check-tag, build-wheels, build-pure-wheels]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: prerelease
    permissions:
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true
