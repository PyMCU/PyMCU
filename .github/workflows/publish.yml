name: Publish Wheels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Classifies the triggering ref: stable tag, pre-release tag, or no tag
  # (manual dispatch without a tag — wheels are built but nothing is published).
  check-tag:
    name: Detect release type
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is_stable: ${{ steps.tag.outputs.is_stable }}
      is_prerelease: ${{ steps.tag.outputs.is_prerelease }}
    steps:
      - name: Classify tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME:-}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true"     >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "is_stable=false"    >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true"  >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false"    >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build-stdlib:
    name: Build pymcu-stdlib
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build stdlib wheel
        run: cd lib && uv build

      - name: Upload stdlib artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-stdlib
          path: lib/dist/*
          retention-days: 15

  # One native job per platform — produces a single py3-none-<platform> wheel
  # per OS/arch. pymcuc is a .NET AOT binary with no Python ABI dependency, so
  # there is no need to build one wheel per Python version.
  #
  # The macOS x86_64 (osx-x64) wheel is cross-compiled from the macos-latest
  # (Apple Silicon) runner using .NET's built-in cross-compilation support,
  # avoiding the slow macos-13 Intel runner entirely.
  build-wheels:
    name: Build wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-latest
          - name: macos-x64
            os: macos-latest
            dotnet_rid: osx-x64
            wheel_platform_tag: macosx_13_0_x86_64
          - name: windows-x64
            os: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheel
        env:
          DOTNET_RID: ${{ matrix.dotnet_rid }}
          WHEEL_PLATFORM_TAG: ${{ matrix.wheel_platform_tag }}
        run: uv build --wheel

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*.whl
          retention-days: 15

  # Pure-Python SDK that codegen backends depend on.
  build-backend-sdk:
    name: Build pymcu-backend-sdk
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build backend-sdk wheel + sdist
        working-directory: extensions/pymcu-backend-sdk
        run: uv build

      - name: Upload backend-sdk artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-backend-sdk
          path: extensions/pymcu-backend-sdk/dist/*
          retention-days: 15

  # Pure-Python toolchain SDK (shared base for all toolchain drivers).
  build-toolchain-sdk:
    name: Build pymcu-toolchain-sdk wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build toolchain-sdk wheel
        working-directory: extensions/pymcu-toolchain-sdk
        run: uv build

      - name: Upload toolchain-sdk artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-toolchain-sdk
          path: extensions/pymcu-toolchain-sdk/dist/*
          retention-days: 15

  # pymcu-avr — merged AVR extension: codegen backend (.NET AOT) + toolchain driver (Python).
  # One binary wheel per platform; same matrix as build-wheels.
  # macos-x64 is cross-compiled from the arm64 runner using DOTNET_RID.
  build-avr:
    name: Build pymcu-avr (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            dotnet_rid: linux-x64
            wheel_tag: manylinux_2_28_x86_64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            dotnet_rid: linux-arm64
            wheel_tag: manylinux_2_28_aarch64
          - name: macos-arm64
            os: macos-latest
            dotnet_rid: osx-arm64
            wheel_tag: macosx_14_0_arm64
          - name: macos-x64
            os: macos-latest
            dotnet_rid: osx-x64
            wheel_tag: macosx_13_0_x86_64
          - name: windows-x64
            os: windows-latest
            dotnet_rid: win-x64
            wheel_tag: win_amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build pymcu-avr wheel
        working-directory: extensions/pymcu-avr
        env:
          DOTNET_RID: ${{ matrix.dotnet_rid }}
          WHEEL_PLATFORM_TAG: ${{ matrix.wheel_tag }}
        run: uv build --wheel

      - name: Smoke test (Linux x64 only)
        if: matrix.name == 'linux-x64'
        run: |
          WHEEL=$(ls extensions/pymcu-avr/dist/pymcu_avr-*.whl | head -1)
          pip install "$WHEEL" --no-deps
          python -c "
          from pymcu.backend.avr import AvrBackendPlugin
          b = AvrBackendPlugin.get_backend_binary()
          print(f'Binary: {b}')
          assert b.exists(), f'Binary not found: {b}'
          import subprocess
          r = subprocess.run([str(b), '--help'], capture_output=True)
          assert r.returncode == 0, f'--help exited {r.returncode}'
          print('Smoke test passed.')
          "

      - name: Upload pymcu-avr wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-avr-${{ matrix.name }}
          path: extensions/pymcu-avr/dist/*.whl
          retention-days: 15

  # Runs only on a stable tag: vX.Y.Z (digits and dots only after the v).
  publish-pypi:
    name: Publish to PyPI
    needs: [check-tag, build-stdlib, build-wheels, build-backend-sdk, build-avr, build-toolchain-sdk]
    if: needs.check-tag.outputs.is_stable == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Publish to PyPI
        run: uv publish dist/*

  # Runs only on a pre-release tag (any v* tag that is not vX.Y.Z).
  publish-testpypi:
    name: Publish to TestPyPI
    needs: [check-tag, build-stdlib, build-wheels, build-backend-sdk, build-avr, build-toolchain-sdk]
    if: needs.check-tag.outputs.is_prerelease == 'true'
    runs-on: ubuntu-latest
    environment: prerelease
    permissions:
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Publish to TestPyPI
        run: uv publish --publish-url https://test.pypi.org/legacy/ dist/*

  # Publishes all wheels to the private Gitea index on every tag push or
  # manual workflow_dispatch. The Gitea instance is only reachable via the
  # Headscale network — the Tailscale action connects the runner before publishing.
  publish-gitea:
    name: Publish to Gitea (private index)
    needs:
      - build-stdlib
      - build-wheels
      - build-backend-sdk
      - build-avr
      - build-toolchain-sdk
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: gitea
    permissions:
      contents: read

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Connect to Headscale network
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.HEADSCALE_AUTH_KEY }}
          args: --login-server ${{ secrets.HEADSCALE_URL }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Publish to Gitea
        run: |
          uv publish \
            --publish-url "${{ secrets.PRIVATE_PYPI_URL }}" \
            --username "${{ secrets.PRIVATE_PYPI_USERNAME }}" \
            --password "${{ secrets.PRIVATE_PYPI_TOKEN }}" \
            dist/*
