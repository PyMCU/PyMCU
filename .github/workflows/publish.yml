name: Publish Wheels

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # Classifies the triggering ref: stable tag, pre-release tag, or no tag
  # (manual dispatch without a tag — wheels are built but nothing is published).
  check-tag:
    name: Detect release type
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is_stable: ${{ steps.tag.outputs.is_stable }}
      is_prerelease: ${{ steps.tag.outputs.is_prerelease }}
    steps:
      - name: Classify tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME:-}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true"     >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "is_stable=false"    >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true"  >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false"    >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build-stdlib:
    name: Build pymcu-stdlib
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build stdlib wheel
        run: cd lib && uv build

      - name: Upload stdlib artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-stdlib
          path: lib/dist/*
          retention-days: 15

  # One native job per platform — produces a single py3-none-<platform> wheel
  # per OS/arch. pymcuc is a .NET AOT binary with no Python ABI dependency, so
  # there is no need to build one wheel per Python version.
  #
  # The macOS x86_64 (osx-x64) wheel is cross-compiled from the macos-latest
  # (Apple Silicon) runner using .NET's built-in cross-compilation support,
  # avoiding the slow macos-13 Intel runner entirely.
  build-wheels:
    name: Build wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-latest
          - name: macos-x64
            os: macos-latest
            dotnet_rid: osx-x64
            wheel_platform_tag: macosx_13_0_x86_64
          - name: windows-x64
            os: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheel
        env:
          DOTNET_RID: ${{ matrix.dotnet_rid }}
          WHEEL_PLATFORM_TAG: ${{ matrix.wheel_platform_tag }}
        run: uv build --wheel

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*.whl
          retention-days: 15

  # Merged Python SDK (backend + toolchain abstract base classes).
  build-sdk:
    name: Build pymcu-sdk
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build pymcu-sdk wheel + sdist
        working-directory: extensions/pymcu-sdk
        run: uv build

      - name: Upload pymcu-sdk artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-sdk
          path: extensions/pymcu-sdk/dist/*
          retention-days: 15

  # Runs on any release — stable (vX.Y.Z) or pre-release (e.g. v0.1.0a1).
  # The public alpha ships on real PyPI so `pip install --pre pymcu-compiler[avr]`
  # resolves the whole set; TestPyPI is reserved for manual dispatch smoke tests.
  publish-pypi:
    name: Publish to PyPI
    needs: [check-tag, build-stdlib, build-wheels, build-sdk]
    if: needs.check-tag.outputs.is_stable == 'true' || needs.check-tag.outputs.is_prerelease == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Publish to PyPI
        run: uv publish dist/*

  # Manual smoke-test channel: a workflow_dispatch run (no tag) publishes to
  # TestPyPI. Pre-release tags now go to real PyPI via publish-pypi, so this no
  # longer fires on tags.
  publish-testpypi:
    name: Publish to TestPyPI
    needs: [check-tag, build-stdlib, build-wheels, build-sdk]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: prerelease
    permissions:
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Publish to TestPyPI
        run: uv publish --publish-url https://test.pypi.org/legacy/ dist/*

  # Publishes all wheels to the private Gitea index on every tag push or
  # manual workflow_dispatch. The Gitea instance is only reachable via the
  # Headscale network — the Tailscale action connects the runner before publishing.
  publish-gitea:
    name: Publish to Gitea (private index)
    needs:
      - build-stdlib
      - build-wheels
      - build-sdk
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: gitea
    permissions:
      contents: read

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Connect to Headscale network
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.HEADSCALE_AUTH_KEY }}
          args: --login-server ${{ secrets.HEADSCALE_URL }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Publish to Gitea
        run: |
          uv publish \
            --publish-url "${{ secrets.PRIVATE_PYPI_URL }}" \
            --username "${{ secrets.PRIVATE_PYPI_USERNAME }}" \
            --password "${{ secrets.PRIVATE_PYPI_TOKEN }}" \
            dist/*
